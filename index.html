<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행가자</title>
<meta name="description" content="흩어져 사는 친구들과 여행 날짜·여행지를 투표로 정하는 사이트">
<meta property="og:title" content="여행가자 · 친구들과 여행 날짜 맞추기">
<meta property="og:description" content="링크 열고 구글로 로그인해서 되는 날짜랑 가고 싶은 곳을 골라 주세요">
<meta name="theme-color" content="#1F6BFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 디자인: 시안 C(형광펜 플래너) 바탕 + 시안 A(바다 스티커)의 파란 물결 머리·여행지 스티커.
   가독성 우선: 본문 16px, 보조 글자도 충분히 진하게, 라임은 '칠하는 색'으로만 사용 */
:root{
  --bg:#F3F5F1; --card:#FFFFFF; --ink:#121512; --sub:#4E5750; --faint:#7A837C; --line:#E1E5DF;
  --lime:#C8F031; --lime-ink:#121512; --lime-soft:#EEFAC8;
  --sea:#1F6BFF; --sea-deep:#1554D6; --sea-ink:#FFFFFF; --sea-soft:#E7F0FF;
  --sun:#FFD43B; --step:#B34700; --link:#1554D6;
  --sat:#2459D8; --hol:#D93A3F; --ok:#16803C; --bad:#C62E33; --warn:#9A5B00;
  --f:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-logo:"Bagel Fat One","Noto Sans KR",sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E100F; --card:#1A1D1B; --ink:#F1F4EF; --sub:#B4BCB5; --faint:#8E978F; --line:#2C312D;
  --lime:#C8F031; --lime-ink:#121512; --lime-soft:#2A3413;
  --sea:#2D6EF0; --sea-deep:#1747C4; --sea-ink:#FFFFFF; --sea-soft:#16233D;
  --sun:#FFD84D; --step:#FF9A57; --link:#A9C4FF;
  --sat:#86A9FF; --hol:#FF8589; --ok:#5BD88A; --bad:#FF7A7E; --warn:#F2B55A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E100F; --card:#1A1D1B; --ink:#F1F4EF; --sub:#B4BCB5; --faint:#8E978F; --line:#2C312D;
  --lime:#C8F031; --lime-ink:#121512; --lime-soft:#2A3413;
  --sea:#2D6EF0; --sea-deep:#1747C4; --sea-ink:#FFFFFF; --sea-soft:#16233D;
  --sun:#FFD84D; --step:#FF9A57; --link:#A9C4FF;
  --sat:#86A9FF; --hol:#FF8589; --ok:#5BD88A; --bad:#FF7A7E; --warn:#F2B55A; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
img{max-width:100%}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* 상단 바 */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:10px}
.logo{font-family:var(--f-logo);font-size:22px;color:var(--sea);letter-spacing:0;background:none;border:0;padding:10px 4px 10px 0;cursor:pointer;line-height:1;min-height:44px}
.logo b{color:var(--step);font-weight:400}
.me-chip{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--sub)}
.me-chip img,.me-chip .av{width:30px;height:30px;border-radius:50%}
.linkbtn{background:none;border:0;padding:10px 6px;min-height:40px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}

/* 파란 물결 머리 (시안 A) */
.hero{background:var(--sea);color:var(--sea-ink);border-radius:var(--r) var(--r) 0 0;padding:20px 18px 24px;position:relative;margin-bottom:22px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 10px -2px,var(--sea) 11px,transparent 12px) 0 0/20px 12px repeat-x}
.hero .status{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#1B1A10;font-weight:700;font-size:13px;border-radius:999px;padding:3px 11px}
.hero .status.fixed{background:var(--lime);color:var(--lime-ink)}
.hero h1{font-weight:900;font-size:28px;line-height:1.3;letter-spacing:-.04em;margin-top:10px}
.hero .meta{font-size:15px;margin-top:4px}
.hero .fixedline{margin-top:12px;background:var(--sea-deep);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px}
.friends{display:flex;gap:6px;align-items:center;margin-top:14px;flex-wrap:wrap}
.friends .stack{display:flex}
.friends .stack .av{margin-left:-8px;border:2px solid var(--sea)}
.friends .stack .av:first-child{margin-left:0}
.friends .txt{font-size:14px;font-weight:500;margin-left:6px}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:900;font-size:14px;color:#121512;flex:none;position:relative}
.av.me{color:var(--bg)}
.hero-actions{display:grid;gap:8px;margin-top:16px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:14px;font-weight:700;font-size:17px;cursor:pointer;padding:10px 16px;text-align:center}
.bigbtn.lime{background:var(--lime);color:var(--lime-ink)}
.bigbtn.sun{background:var(--sun);color:#1B1A10}
.bigbtn.ink{background:var(--ink);color:var(--bg)}
.bigbtn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor;min-height:48px;font-size:16px}
.bigbtn:disabled{opacity:.5;cursor:not-allowed}
.copy-st{font-size:14px;font-weight:500;min-height:1.2em}

/* 탭 (알약) */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:6px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;background:var(--card);color:var(--sub);cursor:pointer;position:relative}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tabs .dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--step)}

/* 카드 */
.card{background:var(--card);border-radius:var(--r);padding:20px 18px;margin-top:14px}
.step{font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--step)}
.card h2{font-weight:900;font-size:21px;line-height:1.35;letter-spacing:-.03em;margin-top:2px}
.lead{color:var(--sub);font-size:15px;margin:4px 0 0}
.small{font-size:14px}.muted{color:var(--sub)}
.hl{background:linear-gradient(transparent 58%,var(--lime) 58% 92%,transparent 92%);padding:0 2px}
.notice{border-radius:14px;padding:12px 14px;font-size:15px;margin-top:12px;background:var(--sea-soft);color:var(--ink)}
.notice.warn{background:var(--lime-soft)}
.notice b{font-weight:700}
.empty{background:var(--card);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--sub);margin-top:14px}
.err{color:var(--bad);font-size:14px;font-weight:500;min-height:1.2em;margin-top:8px}
.okmsg{color:var(--ok)}

/* 버튼/입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;min-height:44px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:700;font-size:15px}
.hint{font-size:14px;color:var(--sub);font-weight:400}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:11px 13px;font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--sea);outline:none;background:var(--card)}
textarea{min-height:80px;resize:vertical}
.form{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

/* 칩 / 스티커 (시안 A) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);min-height:42px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-weight:500;font-size:13px;opacity:.8}
.sticker{transition:transform .15s}
.sticker[aria-pressed=true]{transform:rotate(-2deg)}
@media (prefers-reduced-motion:reduce){.sticker{transition:none}.sticker[aria-pressed=true]{transform:none}}

/* 달력 (시안 C: 형광펜 + 친구 점) */
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px}
.mhead b{font-weight:900;font-size:19px}
.mnav{display:flex;gap:6px}
.mnav button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;color:var(--ink)}
.mnav button:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cal .wd{font-size:13px;color:var(--sub);padding:4px 0;font-weight:700}
.cal .wd.su{color:var(--hol)}.cal .wd.sa{color:var(--sat)}
.cal .d{min-height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;padding:2px 0;cursor:pointer;color:var(--ink)}
.cal .d b{font-weight:700;font-size:16px;line-height:1}
.cal .d.su b,.cal .d.hol b{color:var(--hol)}.cal .d.sa b{color:var(--sat)}
.cal .d.off{visibility:hidden}
.cal .d.na{opacity:.28;cursor:default}
.cal .d.on{background:var(--lime)}
.cal .d.on b{color:var(--lime-ink)!important}
.cal .d.fin{box-shadow:inset 0 0 0 2.5px var(--sea)}
.cal .d[disabled]{cursor:default}
.dots{display:flex;gap:2px;height:7px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:38px}
.dots i{width:7px;height:7px;border-radius:50%}
.dots .more{font-size:11px;font-weight:700;line-height:7px;color:var(--sub);font-style:normal}
.cal .d.on .dots .more{color:var(--lime-ink)}
.holidays{margin-top:8px;font-size:14px;color:var(--hol);font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.heat .d{cursor:default}
.heat .d .cnt{font-size:13px;font-weight:700;line-height:1}
.heat .d.all{box-shadow:inset 0 0 0 2.5px var(--step)}

/* 하단 고정 저장 바 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .info{flex:1;min-width:0;font-size:14px;line-height:1.35}
.dock .info b{font-size:15px}
.dock .st{color:var(--sub)}.dock .st.ok{color:var(--ok)}.dock .st.err{color:var(--bad)}
.dock .bigbtn{width:auto;min-height:48px;font-size:16px;padding:0 18px;flex:none}

/* 결과 (시안 C) */
.best{margin-top:14px;border-radius:16px;background:var(--lime);color:var(--lime-ink);padding:16px}
.best .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;flex-wrap:wrap}
.best .rk{background:var(--lime-ink);color:var(--lime);border-radius:7px;padding:1px 8px}
.best .dt{font-weight:900;font-size:27px;letter-spacing:-.04em;margin-top:8px;line-height:1.25}
.best .sub{font-size:15px;font-weight:500;margin-top:4px}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .rk{font-weight:900;font-size:17px;color:var(--sub);text-align:center}
.opt .dt{font-weight:700;font-size:16px}
.opt .no{font-size:14px;color:var(--sub)}
.meter{display:flex;gap:3px;align-items:center}
.meter i{width:8px;height:20px;border-radius:3px;background:var(--line)}
.meter i.f{background:var(--ink)}
.meter b{font-size:14px;margin-left:6px}
.place{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-top:16px}
.place .nm{font-weight:900;font-size:17px}
.place .v{font-weight:700}
.place .who{grid-column:1/3;font-size:14px;color:var(--sub)}
.place .track{grid-column:1/3;height:12px;border-radius:6px;background:var(--bg);overflow:hidden;display:flex;gap:2px}
.place .track i{display:block;height:100%}
.who-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.who{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;font-weight:500}
.who .av{width:26px;height:26px;font-size:12px}
.who .tag{font-size:13px;font-weight:700}
.tag.done{color:var(--ok)}.tag.wait{color:var(--warn)}.tag.none{color:var(--sub)}
details.more{margin-top:8px}
details.more summary{cursor:pointer;font-weight:700;color:var(--sub);padding:8px 0;font-size:15px}

/* 선택지 (확정) */
.choices{display:grid;gap:8px;margin-top:8px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--bg);cursor:pointer;border:1.5px solid transparent}
.choice:has(input:checked){border-color:var(--ink);background:var(--card)}
.choice input[type=radio]{margin-top:5px;accent-color:var(--ink);width:18px;height:18px;flex:none}
.choice .c-main{flex:1;min-width:0}
.confirmbox{margin-top:12px;padding:14px;border-radius:14px;background:var(--lime-soft)}
.dangerbox{margin-top:10px;padding:12px;border-radius:12px;border:1.5px solid var(--bad);display:grid;gap:8px}

/* 정보 탭 카드 */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.gcard{background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard .t{font-weight:900;font-size:17px}
.gcard .a{font-size:13px;color:var(--sub);font-weight:500}
.gcard p{margin:0;font-size:15px}
.gcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font-size:14px;font-weight:700;color:var(--link);text-decoration:none;background:var(--sea-soft);border-radius:999px;padding:9px 13px;display:inline-flex;align-items:center;min-height:40px}
.links a:hover{text-decoration:underline}
.like{border:0;background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:700;font-size:14px;color:var(--sub)}
.like[aria-pressed=true]{color:var(--bad)}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .ck{display:grid;place-items:center;min-width:44px;min-height:44px;margin:-8px 0 -8px -10px;cursor:pointer}
.todo input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok)}
.todo.done .tx{text-decoration:line-through;color:var(--sub)}
.todo select{padding:8px 10px;font-size:14px;width:auto;max-width:130px;min-height:40px}

/* 홈 */
.trips{display:grid;gap:10px;margin-top:14px}
.tripcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border-radius:var(--r);padding:16px 18px;border:0;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.tripcard:hover{box-shadow:inset 0 0 0 2px var(--sea)}
.tripcard .nm{font-weight:900;font-size:19px;line-height:1.35}
.tripcard .meta{font-size:14px;color:var(--sub);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--bg);color:var(--sub);white-space:nowrap}
.pill.open{background:var(--sun);color:#1B1A10}
.pill.fixed{background:var(--lime);color:var(--lime-ink)}
.pill.dday{background:var(--sea-soft);color:var(--link)}
.landing{background:var(--sea);color:var(--sea-ink);border-radius:var(--r);padding:28px 20px 30px;margin-top:6px;text-align:center}
.landing h1{font-weight:900;font-size:27px;line-height:1.35;letter-spacing:-.04em}
.landing p{opacity:.92;margin:10px auto 0;max-width:30em}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:999px;padding:0 22px;font-weight:700;cursor:pointer;min-height:52px;font-size:16px;margin-top:20px}
.gbtn svg{width:20px;height:20px}
.steps{margin:10px 0 0;padding-left:22px;color:var(--sub)}
.steps li{margin-bottom:6px}
.inapp{background:var(--sun);color:#1B1A10;border-radius:var(--r);padding:20px;margin-top:10px}
.inapp h2{font-size:20px;font-weight:900}
.inapp ol{margin:8px 0 0;padding-left:20px}
.inapp .url{font-size:13px;word-break:break-all;background:rgba(255,255,255,.6);border-radius:8px;padding:8px;margin-top:10px;user-select:all}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--sub);padding:40px 0}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sea);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <button class="logo" id="logo" aria-label="여행가자 처음 화면">여행가자<b>!</b></button>
    <div class="me-chip" id="meChip"></div>
  </header>
  <div id="banner"></div>
  <main id="app"><div class="loading"><span class="spin"></span>불러오는 중이에요</div></main>
</div>
<div class="dock" id="dock" hidden></div>

    leaveTrip:(id,uid)=>{const b=fs.batch();b.update(T(id),{memberUids:FV.arrayRemove(uid)});b.delete(T(id).collection("members").doc(uid));return b.commit()},
    kickMember:(id,uid)=>{const b=fs.batch();b.update(T(id),{memberUids:FV.arrayRemove(uid)});b.delete(T(id).collection("members").doc(uid));return b.commit()},
    saveMember:(id,uid,data)=>T(id).collection("members").doc(uid).set(data,{merge:true}),
    addRec:(id,d)=>T(id).collection("recs").add(d),
    toggleLike:(id,r,uid,on)=>T(id).collection("recs").doc(r).update({likes:on?FV.arrayUnion(uid):FV.arrayRemove(uid)}),

      for(let i=0;i<refs.length;i+=8){const b=fs.batch();refs.slice(i,i+8).forEach(r=>b.delete(r));await b.commit()}

  let me=null,userCb=()=>{};

    demo:true,
    onUser:cb=>{userCb=cb;setTimeout(()=>cb(me),0);return()=>{}},
    login:async()=>{me={uid:"me",name:"나",photo:""};userCb(me)},

    onMyTrips:(uid,cb)=>sub(()=>cb(Object.entries(DB.trips).filter(([k,t])=>t.memberUids.includes(uid)).map(([k,t])=>({id:k,...cl(t)})))),
    onTrip:(id,cb)=>sub(()=>cb(DB.trips[id]?{id,...cl(DB.trips[id])}:null)),
    onMembers:(id,cb)=>sub(()=>cb(list(id,"members"))),
    onRecs:(id,cb)=>sub(()=>cb(list(id,"recs"))),
    onTodos:(id,cb)=>sub(()=>cb(list(id,"todos"))),
    createTrip:async(d,nick)=>{const id=rid();DB.trips[id]=cl(d);S(id,"members")[d.leader]={nickname:nick,updatedAt:Date.now()};emit();return id},
    updateTrip:async(id,p)=>{Object.assign(DB.trips[id],cl(p));emit()},
    joinTrip:async(id,uid,nick)=>{const t=DB.trips[id];if(!t.memberUids.includes(uid))t.memberUids.push(uid);const m=S(id,"members");m[uid]=Object.assign(m[uid]||{},{nickname:nick,updatedAt:Date.now()});emit()},
    leaveTrip:async(id,uid)=>{delete S(id,"members")[uid];DB.trips[id].memberUids=DB.trips[id].memberUids.filter(x=>x!==uid);emit()},
    kickMember:async(id,uid)=>{delete S(id,"members")[uid];DB.trips[id].memberUids=DB.trips[id].memberUids.filter(x=>x!==uid);emit()},
    saveMember:async(id,uid,d)=>{const m=S(id,"members");m[uid]=Object.assign(m[uid]||{},cl(d));emit()},
    addRec:async(id,d)=>{S(id,"recs")[rid()]=cl(d);emit()},
    toggleLike:async(id,r,uid,on)=>{const x=S(id,"recs")[r];x.likes=(x.likes||[]).filter(u=>u!==uid);if(on)x.likes.push(uid);emit()},
    deleteRec:async(id,r)=>{delete S(id,"recs")[r];emit()},
    addTodo:async(id,d)=>{S(id,"todos")[rid()]=cl(d);emit()},
    updateTodo:async(id,t,p)=>{Object.assign(S(id,"todos")[t],cl(p));emit()},
    deleteTodo:async(id,t)=>{delete S(id,"todos")[t];emit()},
    deleteTrip:async id=>{delete DB.trips[id];delete DB.sub[id];emit()}
  };
}

function closeTrip(){
  flushSave();
  if(tripUnsub){tripUnsub();tripUnsub=null}
  stopSubs();
  cur=null;curTrip=null;members=[];rawMembers=[];recs=[];todos=[];mine=null;membersReady=false;
  askFix=false;askDelete=false;askLeave=false;pendingKick=null;pendingHand=null;pendingDelRec=null;
}
function stopSubs(){subUnsubs.forEach(u=>u());subUnsubs=[];subsOn=false}
function goHome(o={}){
  closeTrip();
  if(!o.nohist)history.pushState({view:"home"},"",location.pathname);
  setDock(null);renderHome();window.scrollTo(0,0);
}
function openTrip(id,o={}){
  if(cur&&cur!==id)closeTrip();
  cur=id;curTrip=null;membersReady=false;tab=o.tab||null;calMonth=null;
  selWin=null;selPlace=null;customPlace="";manualStart="";manualEnd="";leaderSig="";
  const st={view:"trip",trip:id,tab:o.tab||"vote"};
  if(o.replace)history.replaceState(st,"","?trip="+encodeURIComponent(id));
  else if(!o.nohist)history.pushState(st,"","?trip="+encodeURIComponent(id));
  $("#app").innerHTML=`<div class="loading"><span class="spin"></span>여행을 불러오는 중이에요</div>`;
  setDock(null);
  tripUnsub=api.onTrip(id,t=>{
    if(cur!==id)return;
    const first=!curTrip;curTrip=t;filterMembers();
    if(!t){stopSubs();setDock(null);$("#app").innerHTML=`<div class="empty">이 여행을 찾을 수 없어요.<br>링크가 잘못됐거나 여행장이 삭제했을 수 있어요.<br><br><button class="btn" id="toHome">내 여행으로</button></div>`;$("#toHome").onclick=()=>goHome();return}
    if(tab===null)tab=t.status==="fixed"?"guide":"vote";
    if(isMember()&&!subsOn)startSubs(id);
    if(!isMember()&&subsOn){stopSubs();members=[];rawMembers=[];mine=null;membersReady=false}
    if(first||!$("#tripHead"))renderTrip();else onData();
  },e=>{if(cur!==id)return;$("#app").innerHTML=`<div class="empty">여행을 불러오지 못했어요. 링크를 다시 확인하거나 새로고침해 주세요.</div>`});
  window.scrollTo(0,0);
}
function startSubs(id){
  subsOn=true;
  const fail=()=>{const el=$("#pane");if(el&&!membersReady)el.innerHTML=`<div class="empty">친구들 응답을 불러오지 못했어요. 새로고침해 주세요.</div>`};
  subUnsubs.push(api.onMembers(id,list=>{
    if(cur!==id)return;
    rawMembers=list;filterMembers();membersReady=true;
    const m=memberById(me.uid);
    if(m){
      // 다른 기기에서 고친 내용이 더 새로우면 받아오기 (편집 중이 아닐 때만)
      if(!mine||(!mineDirty&&!saving&&(m.updatedAt||0)>lastSavedAt&&!editingNow())){loadMine(m)}
    }
    onData();
  },fail));
  subUnsubs.push(api.onRecs(id,l=>{if(cur!==id)return;recs=l;if(tab==="guide")renderGuideLists()},()=>{}));
  subUnsubs.push(api.onTodos(id,l=>{if(cur!==id)return;todos=l;if(tab==="guide")renderGuideLists()},()=>{}));
}
function loadMine(m){
  mine={nickname:m.nickname||"",dates:new Set(m.dates||[]),places:m.places||[],note:m.note||"",region:m.region||"",done:!!m.done,none:!!m.none};
  lastSavedAt=Math.max(lastSavedAt,m.updatedAt||0);
  if(tab==="vote"&&$("#voteRoot")){fillVoteInputs();renderMyCal();renderPlaceChips();updateDock()}
}
function editingNow(){const a=document.activeElement;return !!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
function onData(){
  if(!cur||!curTrip)return;
  if(!$("#tripHead")){renderTrip();return}
  renderTripHead();renderTabs();
  if(!isMember()){mine=null;if(!$("#joinForm"))renderJoin();setDock(null);return}
  if(!membersReady){const p=$("#pane");if(p&&!p.querySelector(".loading"))p.innerHTML=`<div class="loading"><span class="spin"></span>친구들 응답을 불러오는 중이에요</div>`;setDock(null);return}
  if(tab==="vote"){if($("#voteRoot")&&mine)refreshVote();else renderVote()}
  if(tab!=="result")leaderSig="";
  if(tab==="result")renderResult();
  if(tab==="guide")renderGuide(false);
  if(tab==="manage")renderManage(false);
  updateDock();
}
function renderTrip(){
  $("#app").innerHTML=`<div id="tripHead"></div><div class="tabs" role="tablist" id="tabs"></div><div id="pane"></div>`;
  renderTripHead();renderTabs();renderPane();
}
function setTab(t){

  const tb=$("#tabs");if(tb)tb.scrollIntoView({block:"start",behavior:"smooth"});
}
function renderPane(){
  const p=$("#pane");if(!p)return;p.innerHTML="";leaderSig="";
  if(!isMember()){renderJoin();setDock(null);return}
  if(!membersReady){p.innerHTML=`<div class="loading"><span class="spin"></span>친구들 응답을 불러오는 중이에요</div>`;setDock(null);return}
  if(tab==="vote")renderVote();
  if(tab==="result")renderResult();
  if(tab==="guide")renderGuide(true);
  if(tab==="manage")renderManage(true);
  updateDock();
}

/* 여행 정보 입력 칸 (만들기·수정 공용) */
function tripFields(t,isNew){
  const opts=tripDays(t);
  return `
    <div class="field"><label for="fName">여행 이름</label><input type="text" id="fName" maxlength="40" value="${esc(t.name)}" placeholder="예) 대학 동기 겨울 여행" required></div>
    ${isNew?`<div class="field"><label for="fNick">내 닉네임 (여행장)</label><input type="text" id="fNick" maxlength="20" value="${esc(t.leaderNick)}" required></div>`:""}
    <div class="field"><span class="lbl">여행 갈 수 있는 기간</span><span class="hint">친구들은 이 기간 안에서 되는 날을 골라요.</span>
      <div class="grid2"><div class="field"><label class="hint" for="fStart">시작</label><input type="date" id="fStart" value="${esc(t.start)}" min="${isNew?todayISO():""}" required></div>
      <div class="field"><label class="hint" for="fEnd">끝</label><input type="date" id="fEnd" value="${esc(t.end)}" required></div></div></div>
    <div class="field"><span class="lbl">여행 길이 <span class="hint">여러 개 골라도 돼요</span></span>
      <div class="chips" id="fDays" style="margin-top:0">${[1,2,3,4,5,6,7].map(n=>`<button type="button" class="chip" data-len="${n}" aria-pressed="${opts.includes(n)}">${daysLabel(n)}</button>`).join("")}</div></div>
    <div class="grid2">
      <div class="field"><label for="fDeadline">응답 마감일 <span class="hint">(선택)</span></label><input type="date" id="fDeadline" value="${esc(t.deadline||"")}" min="${todayISO()}"></div>
      <div class="field"><label for="fExpected">예정 인원 <span class="hint">(나 포함, 선택)</span></label><input type="number" id="fExpected" min="1" max="50" inputmode="numeric" value="${esc(t.expected||"")}" placeholder="예) 5"></div>
    </div>
    <div class="field"><label for="fSeeds">여행지 후보 <span class="hint">(선택, 쉼표로 구분)</span></label><input type="text" id="fSeeds" value="${esc((t.seeds||[]).join(", "))}" placeholder="예) 제주, 강릉, 부산"></div>`;
}
function bindTripFields(){$$("#fDays [data-len]").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"))}
function readTripFields(isNew){
  const name=norm($("#fName").value),nick=isNew?norm($("#fNick").value):"",start=$("#fStart").value,end=$("#fEnd").value;
  const daysOptions=$$('#fDays [aria-pressed="true"]').map(b=>Number(b.dataset.len)).sort((a,b)=>a-b);
  const deadline=$("#fDeadline").value||"",ex=$("#fExpected").value,expected=ex?Math.max(0,Math.min(50,Math.round(Number(ex))||0)):0;
  const seeds=[...new Set($("#fSeeds").value.split(",").map(norm).filter(Boolean).map(s=>s.slice(0,30)))].slice(0,15);
  let error="";
  if(!name)error="여행 이름을 적어 주세요.";
  else if(isNew&&!nick)error="내 닉네임을 적어 주세요.";
  else if(!start||!end)error="여행 갈 수 있는 기간을 골라 주세요.";
  else if(isNew&&dayDiff(todayISO(),start)<0)error="기간 시작일은 오늘 이후로 골라 주세요.";
  else if(dayDiff(start,end)<0)error="기간의 끝 날짜가 시작 날짜보다 뒤여야 해요.";
  else if(dayDiff(start,end)>119)error="기간은 120일 이내로 정해 주세요.";
  else if(!daysOptions.length)error="여행 길이를 하나 이상 골라 주세요.";
  else if(dayDiff(start,end)+1<daysOptions[0])error="기간이 가장 짧은 여행 길이보다 짧아요.";
  else if(deadline&&dayDiff(deadline,end)<0)error="응답 마감일은 기간이 끝나기 전이어야 해요.";
  else if(deadline&&dayDiff(todayISO(),deadline)<0&&(isNew||deadline!==(curTrip&&curTrip.deadline)))error="응답 마감일은 오늘 이후로 골라 주세요.";
  return {name,nick,start,end,daysOptions,deadline,expected,seeds,error};
}

function copyText(text,st,box,okMsg){
  const ok=()=>{if(st){st.textContent=okMsg||"복사했어요";st.style.color=""}};
  const fb=()=>{
    if(box){try{const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
    else{try{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const okc=document.execCommand("copy");ta.remove();if(okc){ok();return}}catch(e){}}
    if(st){st.textContent="자동 복사가 안 돼요. 길게 눌러 직접 복사해 주세요.";}
  };
  try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
}
/* 캘린더 파일 규칙: 한 줄 75바이트마다 줄을 접어요 */
function foldIcs(line){const enc=new TextEncoder();let out="",cur="",len=0;for(const ch of line){const n=enc.encode(ch).length;if(len+n>(out?74:75)){out+=(out?"\r\n ":"")+cur;cur="";len=0}cur+=ch;len+=n}return out?out+"\r\n "+cur:cur}
function downloadIcs(){
  const t=curTrip;if(!t||!t.finalStart)return;
  const dt=s=>s.replace(/-/g,"");
  const escI=s=>String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n");
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//yeohaenggaja//KO","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:"+cur+"@yeohaenggaja","DTSTAMP:"+now,"DTSTART;VALUE=DATE:"+dt(t.finalStart),"DTEND;VALUE=DATE:"+dt(iso(addDays(parse(t.finalEnd),1))),
    "SUMMARY:"+escI(t.finalDest+" 여행 ("+t.name+")"),"DESCRIPTION:"+escI(APP+" "+inviteUrl(cur)),"END:VEVENT","END:VCALENDAR"].map(foldIcs).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="trip-"+t.finalStart+".ics";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  const st=$("#headSt");if(st)st.textContent="캘린더 파일을 받았어요. 알림창에서 파일을 눌러 캘린더에 추가해 주세요.";
}

function holidayLine(month,all){const inR=new Set(all);const h=Object.entries(HOLIDAYS).filter(([d])=>d.startsWith(month)&&inR.has(d));return h.length?`<div class="holidays">이달 공휴일: ${h.map(([d,n])=>Number(d.slice(8))+"일 "+esc(n==="대체"?"대체공휴일":n)).join(", ")}</div>`:""}

function calGrid(month,inRange,cellFn,heat){
  const [y,mo]=month.split("-").map(Number),first=new Date(y,mo-1,1),last=new Date(y,mo,0).getDate();
  let cells=WD.map((w,i)=>`<div class="wd ${i===0?"su":i===6?"sa":""}">${w}</div>`).join("");

/* 저장: 바꾸면 0.6초 뒤 자동 저장, 화면을 떠나면 바로 저장 */
/* kind: "pick"(날짜·여행지 변경 → '응답 완료'를 풀어요) 또는 "text"(메모·지역·이름 → 완료 유지) */
function changed(kind){
  mineDirty=true;changeSeq++;
  if(kind!=="text"&&mine.done){mine.done=false;undone=true}
  saveState="wait";updateDock();
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>doSave(),600);
}
function inRangeDates(){const r=new Set(rangeDates(curTrip));return [...mine.dates].filter(d=>r.has(d)).sort()}
function snapshot(){
  const base={nickname:norm(mine.nickname).slice(0,20)||"친구",updatedAt:Date.now()};
  const data=locked()?base:Object.assign(base,{dates:inRangeDates().slice(0,120),places:mine.places.slice(0,20),note:String(mine.note||"").slice(0,300),region:String(mine.region||"").slice(0,20),done:!!mine.done,none:!!mine.none});
  return {trip:cur,uid:me&&me.uid,data};
}
async function doSave(){
  if(!cur||!mine||!me)return;
  if(savingP){saveAgain=true;return savingP}
  const seq=changeSeq,s=snapshot();
  saving=true;saveState="saving";updateDock();
  savingP=api.saveMember(s.trip,s.uid,s.data).then(()=>{lastSavedAt=s.data.updatedAt;if(s.trip===cur&&seq===changeSeq){mineDirty=false;saveState="ok"}},()=>{if(s.trip===cur)saveState="err"});
  await savingP;savingP=null;saving=false;
  // 저장하는 사이에 또 바뀌었으면 한 번 더 저장 (QA N-01)
  if(cur===s.trip&&mineDirty&&saveState!=="err"&&(saveAgain||seq!==changeSeq)){saveAgain=false;return doSave()}
  saveAgain=false;updateDock();
}
function flushSave(){
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null}

    if(!mine.none&&!inRangeDates().length){const s=$("#dock .st");if(s){s.textContent="날짜를 고르거나 ‘갈 수 있는 날이 없어요’를 체크해 주세요";s.className="st err"}return}

function computeWindows(){
  const t=curTrip,all=rangeDates(t),total=members.filter(m=>(t.memberUids||[]).includes(m.id));
  const sets=new Map(total.map(m=>[m.id,new Set(m.none?[]:(m.dates||[]))]));
  const wins=[];
  for(const n of tripDays(t)){
    for(let i=0;i+n<=all.length;i++){
      const win=all.slice(i,i+n);
      const can=total.filter(m=>win.every(d=>sets.get(m.id).has(d)));
      if(!can.length)continue;
      wins.push({key:win[0]+"|"+n,n,start:win[0],end:win[win.length-1],can,cant:total.filter(m=>!can.includes(m))});
    }
  }
  wins.sort((a,b)=>b.can.length-a.can.length||b.n-a.n||a.start.localeCompare(b.start));
  const kept=[];
  for(const w of wins){if(kept.some(k=>k.n>w.n&&k.start<=w.start&&k.end>=w.end&&k.can.length>=w.can.length))continue;kept.push(w);if(kept.length>=8)break}
  return {wins:kept,total};
}
function placeRank(){return placePool().filter(x=>x.voters.length).sort((a,b)=>b.voters.length-a.voters.length||a.name.localeCompare(b.name,"ko"))}

  renderLeaderArea();

function resolveFix(){
  const {wins}=computeWindows(),places=placeRank();
  let start,end;
  if(selWin==="__manual"){
    start=manualStart;end=manualEnd||manualStart;
    if(!start)return {error:"출발 날짜를 골라 주세요."};
    if(dayDiff(todayISO(),start)<0)return {error:"출발 날짜는 오늘 이후로 골라 주세요."};
    if(dayDiff(start,end)<0)return {error:"돌아오는 날이 출발보다 뒤여야 해요."};
    if(dayDiff(start,end)>30)return {error:"여행 기간은 31일 이내로 정해 주세요."};
  }else{
    const w=wins.find(x=>x.key===selWin);if(!w)return {error:"일정이 바뀌었어요. 다시 골라 주세요."};
    start=w.start;end=w.end;
  }
  let dest=selPlace==="__custom"?norm(customPlace).slice(0,30):selPlace;
  if(selPlace!=="__custom"&&!places.some(x=>x.name===selPlace))return {error:"여행지가 바뀌었어요. 다시 골라 주세요."};
  if(!dest)return {error:"여행지를 골라 주세요."};
  return {start,end,days:dayDiff(start,end)+1,dest};
}

/* ======================= 여행 정보 ======================= */
const CATS={spot:"가볼 만한 곳",stay:"숙소",food:"맛집"};
const L={
  naver:q=>"https://map.naver.com/p/search/"+encodeURIComponent(q),
  kakao:q=>"https://map.kakao.com/?q="+encodeURIComponent(q),
  blog:q=>"https://search.naver.com/search.naver?ssc=tab.blog.all&query="+encodeURIComponent(q),
  yeogi:q=>"https://www.yeogi.com/domestic-accommodations?keyword="+encodeURIComponent(q)
};
function renderGuide(full){
  const p=$("#pane");if(!p)return;const t=curTrip;
  if(t.status!=="fixed"){p.innerHTML=`<div class="empty">아직 여행지와 일정이 확정되지 않았어요.<br>여행장이 확정하면 여기서 숙소·맛집·할 일을 함께 정리할 수 있어요.</div>`;return}
  if(!full&&$("#guideRoot")&&$("#guideRoot").dataset.dest===t.finalDest){renderGuideLists();return}
  const d=t.finalDest,link=(href,txt)=>`<a href="${href}" target="_blank" rel="noopener">${txt}</a>`;
  p.innerHTML=`<div id="guideRoot" data-dest="${esc(d)}">
  <section class="card">
    <h2>${esc(emojiOf(d))} ${esc(d)} 바로 찾아보기</h2>
    <p class="lead">누르면 지도나 후기 검색이 새 창으로 열려요.</p>
    <div class="gcards">
      <div class="gcard"><div class="t">🗺️ 가볼 만한 곳</div><div class="links">${link(L.naver(d+" 가볼만한곳"),"네이버지도")}${link(L.kakao(d+" 관광"),"카카오맵")}${link(L.blog(d+" 가볼만한곳 "+daysLabel(t.finalDays||1)),"블로그 후기")}</div></div>
      <div class="gcard"><div class="t">🛏️ 숙소</div><div class="links">${link(L.naver(d+" 숙소"),"네이버지도")}${link(L.kakao(d+" 숙소"),"카카오맵")}${link(L.yeogi(d),"여기어때")}</div></div>
      <div class="gcard"><div class="t">🍽️ 맛집</div><div class="links">${link(L.naver(d+" 맛집"),"네이버지도")}${link(L.kakao(d+" 맛집"),"카카오맵")}${link(L.blog(d+" 맛집 추천"),"블로그 후기")}</div></div>
    </div>
  </section>
  <section class="card">
    <h2>우리끼리 추천 목록</h2>
    <p class="lead">찾은 곳을 올리고 ♥로 골라요. 하트가 많은 곳이 위로 올라가요.</p>
    <form class="form" id="recForm" style="margin-top:12px">
      <div class="grid2">
        <div class="field"><label for="rCat">종류</label><select id="rCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
        <div class="field"><label for="rName">이름</label><input type="text" id="rName" maxlength="40" placeholder="예) 안목해변 카페거리" required></div>
      </div>
      <div class="field"><label for="rMemo">한줄 메모 <span class="hint">(선택)</span></label><input type="text" id="rMemo" maxlength="100" placeholder="예) 바다 보이는 창가 자리 좋대요"></div>
      <div class="field"><label for="rLink">링크 <span class="hint">(선택)</span></label><input type="text" id="rLink" maxlength="500" placeholder="네이버지도·블로그 주소 붙여넣기" inputmode="url"></div>
      <div class="row"><button class="btn primary" type="submit" id="rSubmit">추천 올리기</button><span class="small" id="recSt" role="status"></span></div>
    </form>
    <div id="recList"></div>
  </section>
  <section class="card">
    <h2>✅ 할 일</h2>
    <p class="lead">숙소 예약, 교통편처럼 나눠서 할 일을 적고 담당자를 정해요.</p>
    <form class="row" id="todoForm" style="margin-top:12px;flex-wrap:nowrap"><input type="text" id="todoText" maxlength="60" placeholder="예) 숙소 예약하기" aria-label="할 일"><button class="btn" type="submit" style="flex:none">추가</button></form>
    <div class="err" id="todoErr"></div>
    <div id="todoList"></div>
  </section></div>`;
  $("#recForm").addEventListener("submit",async ev=>{ev.preventDefault();
    const name=norm($("#rName").value).slice(0,40),st=$("#recSt");if(!name){st.textContent="이름을 적어 주세요.";st.style.color="var(--bad)";return}
    const b=$("#rSubmit");b.disabled=true;
    try{await api.addRec(cur,{cat:$("#rCat").value,name,memo:norm($("#rMemo").value).slice(0,100),link:safeUrl($("#rLink").value).slice(0,500),by:me.uid,dest:curTrip.finalDest,likes:[me.uid],createdAt:Date.now()});
      st.textContent="올렸어요";st.style.color="var(--ok)";$("#rName").value="";$("#rMemo").value="";$("#rLink").value=""}
    catch(e){st.textContent="올리지 못했어요. 다시 눌러 주세요.";st.style.color="var(--bad)"}
    b.disabled=false;
  });
  $("#todoForm").addEventListener("submit",async ev=>{ev.preventDefault();
    const text=norm($("#todoText").value).slice(0,60);if(!text)return;
    try{await api.addTodo(cur,{text,owner:"",done:false,by:me.uid,createdAt:Date.now()});$("#todoText").value="";$("#todoErr").textContent=""}
    catch(e){$("#todoErr").textContent="추가하지 못했어요. 다시 눌러 주세요."}
  });
  renderGuideLists();
}
function renderGuideLists(){renderRecList();renderTodoList()}
function renderRecList(){
  const el=$("#recList");if(!el)return;const d=curTrip.finalDest;
  const curRecs=recs.filter(r=>!r.dest||r.dest===d),old=recs.filter(r=>r.dest&&r.dest!==d);
  const list=curRecs.filter(r=>recCat==="all"||r.cat===recCat).sort((a,b)=>(b.likes||[]).length-(a.likes||[]).length||(b.createdAt||0)-(a.createdAt||0));
  const count=c=>curRecs.filter(r=>c==="all"||r.cat===c).length;
  const card=(r,isOld)=>{const liked=(r.likes||[]).includes(me.uid),link=safeUrl(r.link),q=(r.dest||d)+" "+r.name,canDel=r.by===me.uid||isLeader();
    return `<div class="gcard"><div class="a">${esc(CATS[r.cat]||"")}${isOld?" · 이전 여행지 "+esc(r.dest):""}</div><div class="t">${esc(r.name)}</div>${r.memo?`<p>${esc(r.memo)}</p>`:""}
      <div class="links">${link?`<a href="${esc(link)}" target="_blank" rel="noopener">링크 열기 ↗</a>`:""}<a href="${L.naver(q)}" target="_blank" rel="noopener">네이버지도</a><a href="${L.kakao(q)}" target="_blank" rel="noopener">카카오맵</a></div>
      <div class="foot"><span class="small muted">${esc(nickOf(r.by))}님 추천${canDel?` · <button class="linkbtn" data-del="${esc(r.id)}" style="padding:0">삭제</button>`:""}</span>
        <button class="like" aria-pressed="${liked}" data-like="${esc(r.id)}" aria-label="하트 ${(r.likes||[]).length}개">♥ ${(r.likes||[]).length}</button></div>
      ${pendingDelRec===r.id?`<div class="dangerbox"><span class="small">‘${esc(r.name)}’ 추천을 지울까요?</span><div class="row"><button class="btn small danger" data-delyes="${esc(r.id)}">삭제</button><button class="btn small" data-delno="1">취소</button></div></div>`:""}</div>`};
  el.innerHTML=`<div class="chips" style="margin-top:16px">${[["all","전체"],...Object.entries(CATS)].map(([k,v])=>`<button class="chip" aria-pressed="${recCat===k}" data-cat="${k}">${v}<span class="n">${count(k)}</span></button>`).join("")}</div>
    ${list.length?`<div class="gcards">${list.map(r=>card(r,false)).join("")}</div>`:`<div class="empty" style="background:var(--bg)">${curRecs.length?"이 종류의 추천은 아직 없어요.":"아직 올라온 추천이 없어요. 위의 ‘바로 찾아보기’로 찾은 곳을 첫 번째로 올려 보세요."}</div>`}
    ${old.length?`<details class="more"><summary>이전 여행지 추천 ${old.length}개</summary><div class="gcards">${old.map(r=>card(r,true)).join("")}</div></details>`:""}`;
  el.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{recCat=b.dataset.cat;renderRecList()});
  el.querySelectorAll("[data-like]").forEach(b=>b.onclick=async()=>{const r=recs.find(x=>x.id===b.dataset.like);if(!r)return;b.disabled=true;try{await api.toggleLike(cur,r.id,me.uid,!(r.likes||[]).includes(me.uid))}catch(e){b.disabled=false}});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{pendingDelRec=b.dataset.del;renderRecList()});
  el.querySelectorAll("[data-delno]").forEach(b=>b.onclick=()=>{pendingDelRec=null;renderRecList()});
  el.querySelectorAll("[data-delyes]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api.deleteRec(cur,b.dataset.delyes);pendingDelRec=null}catch(e){b.disabled=false}});
}
function renderTodoList(){
  const el=$("#todoList");if(!el)return;
  if(document.activeElement&&el.contains(document.activeElement)&&document.activeElement.tagName==="SELECT")return;
  const list=todos.slice().sort((a,b)=>(a.done-b.done)||(a.createdAt||0)-(b.createdAt||0));
  const opts=(sel)=>`<option value="">담당자</option>`+members.map(m=>`<option value="${esc(m.id)}" ${sel===m.id?"selected":""}>${esc(m.nickname)}</option>`).join("");
  el.innerHTML=list.length?list.map(x=>`<div class="todo ${x.done?"done":""}"><label class="ck"><input type="checkbox" data-tdone="${esc(x.id)}" ${x.done?"checked":""} aria-label="완료 표시"></label><span class="tx">${esc(x.text)}</span>
    <span class="row" style="gap:4px;flex-wrap:nowrap"><select data-towner="${esc(x.id)}" aria-label="담당자">${opts(x.owner)}</select>${x.by===me.uid||isLeader()?`<button class="linkbtn" data-tdel="${esc(x.id)}" aria-label="할 일 지우기">✕</button>`:""}</span></div>`).join("")
    :`<p class="small muted" style="margin:10px 0 0">아직 할 일이 없어요. 예) 숙소 예약, 렌터카, 기차표, 준비물</p>`;
  el.querySelectorAll("[data-tdone]").forEach(c=>c.onchange=()=>api.updateTodo(cur,c.dataset.tdone,{done:c.checked}).catch(()=>{c.checked=!c.checked}));
  el.querySelectorAll("[data-towner]").forEach(s=>s.onchange=()=>api.updateTodo(cur,s.dataset.towner,{owner:s.value}).catch(()=>{}));
  el.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>api.deleteTodo(cur,b.dataset.tdel).catch(()=>{}));
}

/* ======================= 여행장 메뉴 ======================= */
function renderManage(full){
  const p=$("#pane");if(!p)return;
  if(!isLeader()){p.innerHTML=`<div class="empty">여행장만 볼 수 있는 메뉴예요.</div>`;return}
  if(!full&&$("#manageRoot")){renderMemberAdmin();return}
  const t=curTrip;
  p.innerHTML=`<div id="manageRoot">
  <form class="card form" id="editForm" novalidate>
    <div><div class="step">여행장 메뉴</div><h2>여행 정보 고치기</h2><p class="lead">기간을 줄이면 기간 밖에 고른 날짜는 계산에서 빠져요.</p></div>
    ${tripFields(t,false)}
    <div class="err" id="eErr" role="status"></div>
    <button class="btn primary" type="submit" id="eSubmit" style="min-height:50px">저장하기</button>
  </form>
  <section class="card"><h2>참여자 관리</h2><p class="lead">여행장을 넘기거나, 잘못 들어온 사람을 내보낼 수 있어요.</p><div id="memberAdmin"></div></section>
  <section class="card"><h2>여행 삭제</h2><p class="lead">여행과 모든 응답·추천·할 일이 지워져요. 되돌릴 수 없어요.</p>
    <button class="btn danger" id="delTrip" style="margin-top:10px">이 여행 삭제</button><div id="delBox"></div></section></div>`;
  bindTripFields();
  $("#editForm").addEventListener("submit",async ev=>{ev.preventDefault();
    const v=readTripFields(false),er=$("#eErr");er.className="err";
    if(v.error){er.textContent=v.error;return}
    $("#eSubmit").disabled=true;
    try{await api.updateTrip(cur,{name:v.name,start:v.start,end:v.end,days:v.daysOptions[v.daysOptions.length-1],daysOptions:v.daysOptions,deadline:v.deadline,expected:v.expected,seeds:v.seeds});er.className="err okmsg";er.textContent="저장했어요."}
    catch(e){er.textContent="저장하지 못했어요. 다시 눌러 주세요."}
    $("#eSubmit").disabled=false;
  });
  renderMemberAdmin();renderDelBox();
}
function renderMemberAdmin(){
  const el=$("#memberAdmin");if(!el)return;
  const others=members.filter(m=>m.id!==me.uid);
  el.innerHTML=others.length?others.map(m=>`<div class="todo" style="grid-template-columns:auto minmax(0,1fr) auto">${avatar(m.id,m.nickname)}<b>${esc(m.nickname)}</b>
    <span class="row" style="gap:6px"><button class="btn small" data-hand="${esc(m.id)}">여행장 넘기기</button><button class="btn small danger" data-kick="${esc(m.id)}">내보내기</button></span></div>
    ${pendingHand===m.id?`<div class="dangerbox"><span class="small">${esc(m.nickname)}님에게 여행장을 넘길까요? 넘기면 나는 이 메뉴를 쓸 수 없어요.</span><div class="row"><button class="btn small primary" data-handyes="${esc(m.id)}">넘기기</button><button class="btn small" data-cancel="1">취소</button></div></div>`:""}
    ${pendingKick===m.id?`<div class="dangerbox"><span class="small">${esc(m.nickname)}님을 내보낼까요? 응답이 지워지고, 링크로 다시 들어올 수는 있어요.</span><div class="row"><button class="btn small danger" data-kickyes="${esc(m.id)}">내보내기</button><button class="btn small" data-cancel="1">취소</button></div></div>`:""}`).join("")
    :`<p class="small muted" style="margin:10px 0 0">아직 참여한 친구가 없어요.</p>`;
  el.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>{pendingHand=b.dataset.hand;pendingKick=null;renderMemberAdmin()});
  el.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{pendingKick=b.dataset.kick;pendingHand=null;renderMemberAdmin()});
  el.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{pendingKick=null;pendingHand=null;renderMemberAdmin()});
  el.querySelectorAll("[data-handyes]").forEach(b=>b.onclick=async()=>{const m=memberById(b.dataset.handyes);if(!m)return;b.disabled=true;
    try{await api.updateTrip(cur,{leader:m.id,leaderNick:m.nickname});pendingHand=null;setTab("result")}catch(e){b.disabled=false}});
  el.querySelectorAll("[data-kickyes]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api.kickMember(cur,b.dataset.kickyes);pendingKick=null;renderMemberAdmin()}catch(e){b.disabled=false}});
}
function renderDelBox(){
  const b=$("#delTrip"),box=$("#delBox");if(!b)return;
  b.onclick=()=>{askDelete=true;renderDelBox()};
  box.innerHTML=askDelete?`<div class="dangerbox"><span class="small">‘${esc(curTrip.name)}’을 정말 지울까요?</span><div class="row"><button class="btn small danger" id="delYes">삭제</button><button class="btn small" id="delNo">취소</button></div></div>`:"";
  if(askDelete){$("#delNo").onclick=()=>{askDelete=false;renderDelBox()};
    $("#delYes").onclick=async()=>{const id=cur;$("#delYes").disabled=true;
      try{await api.deleteTrip(id,members.map(m=>m.id),recs.map(r=>r.id),todos.map(x=>x.id));askDelete=false;goHome()}
      catch(e){box.innerHTML=`<div class="err">삭제하지 못했어요. 다시 시도해 주세요.</div>`;askDelete=false}}}
}
</script>
