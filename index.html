<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행가자</title>
<meta name="description" content="흩어져 사는 친구들과 여행 날짜·여행지를 투표로 정하는 사이트">
<meta property="og:title" content="여행가자">
<meta property="og:description" content="링크 열고 구글로 로그인해서 되는 날짜랑 가고 싶은 곳을 골라 주세요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: 출발 안내판 같은 헤더 + 승차권(티켓) 카드. 한 컬럼, 넓은 화면에서는 투표/결과를 2단으로. */
:root{
  --paper:#EEF2EF; --card:#FFFFFF; --ink:#16232B; --muted:#5B6A70; --line:#D5DCD8;
  --accent:#0B6E6A; --accent-soft:#D7ECE9; --accent-ink:#FFFFFF;
  --stamp:#C9701F; --stamp-soft:#F6E5D3;
  --sat:#2F5FB3; --sun:#C43D3D; --ok:#2E7D4F; --warn:#A8521F;
  --board:#16232B; --board-ink:#F2E7C9;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F161A; --card:#172227; --ink:#E4ECEA; --muted:#93A3A7; --line:#2A3940;
  --accent:#3FB6AE; --accent-soft:#163A39; --accent-ink:#04211F;
  --stamp:#E8A15A; --stamp-soft:#3A2A1A;
  --sat:#7FA6F0; --sun:#F08080; --ok:#6CC596; --warn:#F0A070;
  --board:#0A1013; --board-ink:#F2E7C9; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F161A; --card:#172227; --ink:#E4ECEA; --muted:#93A3A7; --line:#2A3940;
  --accent:#3FB6AE; --accent-soft:#163A39; --accent-ink:#04211F;
  --stamp:#E8A15A; --stamp-soft:#3A2A1A;
  --sat:#7FA6F0; --sun:#F08080; --ok:#6CC596; --warn:#F0A070;
  --board:#0A1013; --board-ink:#F2E7C9; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 출발 안내판 헤더 */
.board{background:var(--board);color:var(--board-ink);border-radius:0 0 var(--r) var(--r);padding:18px 20px 16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.board .brand{font-family:var(--f-display);font-size:30px;line-height:1.1;letter-spacing:.02em}
.board .sub{font-size:12.5px;opacity:.75;letter-spacing:.06em}
.board .who{font-size:13px;opacity:.85}
.board button.link{background:none;border:0;color:var(--board-ink);opacity:.8;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

.notice{margin:14px 0 0;padding:12px 14px;border-radius:var(--r);background:var(--stamp-soft);color:var(--ink);font-size:13.5px;border:1px solid color-mix(in srgb,var(--stamp) 35%,transparent)}
.notice b{color:var(--stamp)}

section.block{margin-top:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.h2{font-family:var(--f-display);font-size:24px;line-height:1.2}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);padding:9px 14px;cursor:pointer;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--sun)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* 폼 */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* 승차권 카드 */
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1fr) 116px;overflow:hidden}
.ticket .main{padding:16px 18px;min-width:0}
.ticket .stub{border-left:2px dashed var(--line);padding:14px 12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;background:color-mix(in srgb,var(--accent-soft) 55%,var(--card))}
.ticket::before,.ticket::after{content:"";position:absolute;right:107px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.ticket::before{top:-10px}.ticket::after{bottom:-10px}
.ticket .route{font-family:var(--f-display);font-size:22px;line-height:1.2;word-break:keep-all}
.ticket .meta{font-size:13px;color:var(--muted);margin-top:4px}
.ticket .stub .big{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--accent)}
.ticket .stub small{font-size:11px;color:var(--muted);letter-spacing:.05em}
button.ticket{width:100%;text-align:left;cursor:pointer;padding:0;font:inherit}
button.ticket:hover{border-color:var(--accent)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:14px}
@media (max-width:400px){.ticket{grid-template-columns:minmax(0,1fr) 92px}.ticket::before,.ticket::after{right:83px}}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.pill.open{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pill.fixed{color:var(--stamp);border-color:color-mix(in srgb,var(--stamp) 45%,transparent);background:var(--stamp-soft)}
.pill.lead{color:var(--muted)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--card)}

/* 탭 */
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--stamp);margin-left:5px;vertical-align:middle}

/* 확정 배너 */
.fixed-banner{margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r);background:var(--stamp-soft);border:1px solid color-mix(in srgb,var(--stamp) 40%,transparent)}
.fixed-banner .stampmark{font-family:var(--f-display);color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:2px 8px;transform:rotate(-4deg);font-size:18px}
.fixed-banner .what{font-family:var(--f-display);font-size:20px;line-height:1.25;min-width:0}

/* 달력 */
.cal-tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.month h4{margin:0 0 6px;font-size:14px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);padding-bottom:2px}
.cal .wd.sun{color:var(--sun)}.cal .wd.sat{color:var(--sat)}
.cal .d{aspect-ratio:1/1;max-width:100%;border-radius:7px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;padding:0;position:relative;font-family:var(--f-mono)}
.cal .d.sun,.cal .d.hol{color:var(--sun)}.cal .d.sat{color:var(--sat)}
.cal .d.off{visibility:hidden}
.cal .d.na{opacity:.3;cursor:default;border-style:dashed}
.cal .d.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal .d .cnt{font-size:10px;line-height:1;margin-top:1px}
.cal.heat .d{cursor:default}
.cal .d.all{outline:2px solid var(--stamp);outline-offset:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}

/* 장소 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}

.savebar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.savebar .st.ok{color:var(--ok)}.savebar .st.err{color:var(--sun)}

/* 결과 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.who-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.who-row .pill.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.rank{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.rank .no{font-family:var(--f-display);font-size:20px;color:var(--muted);text-align:center}
.rank li:first-child .no{color:var(--stamp)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.rank .nm{font-weight:600;word-break:keep-all}
.rank .sub{font-size:12px;color:var(--muted)}
.rank .score{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--card)}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:5px;accent-color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}

/* 가이드 */
.gsec{margin-top:22px}
.gsec h3{font-family:var(--f-display);font-size:21px;display:flex;align-items:baseline;gap:8px}
.gsec h3 .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard .t{font-weight:700;font-size:16px;word-break:keep-all}
.gcard .a{font-size:12px;color:var(--muted)}
.gcard p{margin:0;font-size:14px}
.gcard .tip{font-size:13px;color:var(--warn)}
.gcard .maps{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.gcard .maps a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:3px 10px}
.gcard .maps a:hover{background:var(--accent-soft)}
.course{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:10px}
.course li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.course .day{font-family:var(--f-display);font-size:18px;color:var(--accent)}
.tips{margin:10px 0 0;padding-left:20px}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.codebox{font-family:var(--f-mono);font-size:12px;word-break:break-all;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:120px;overflow:auto}
.confirm{margin-top:10px;padding:12px;border-radius:8px;border:1px solid var(--sun);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.steps{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.steps li{margin-bottom:4px}
</style>
<style>
/* 단독 사이트용 추가 스타일 */
.userbox{display:flex;align-items:center;gap:8px;font-size:13px}
.userbox img{width:28px;height:28px;border-radius:50%;border:1px solid var(--board-ink)}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.gbtn svg{width:18px;height:18px}
.login{max-width:520px;margin:28px auto 0;text-align:center}
.login .h2{font-size:28px}
.demo-tag{display:inline-block;font-size:11px;letter-spacing:.08em;background:var(--stamp);color:var(--card);border-radius:4px;padding:1px 6px;vertical-align:middle}
.invite{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.invite input{flex:1;min-width:200px;font-family:var(--f-mono);font-size:12.5px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-size:14px}
.quick a:hover{border-color:var(--accent)}
.quick a b{color:var(--accent);font-weight:600}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.like{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.like[aria-pressed=true]{color:var(--sun);border-color:color-mix(in srgb,var(--sun) 45%,transparent)}
.gcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.gcard .by{font-size:12px;color:var(--muted)}
.gcard a.ext{font-size:12px;color:var(--accent);word-break:break-all}
.xbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header class="board">
    <div>
      <div class="sub mono">DEPARTURES · 다 함께 출발</div>
      <h1 class="brand">여행가자</h1>
    </div>
    <div class="row" id="hdrRight"></div>
  </header>
  <div id="notice"></div>
  <main id="app"><div class="empty" style="margin-top:22px">불러오는 중이에요…</div></main>
</div>

<!-- Firebase(구글 로그인 + 저장소) 프로그램 불러오기 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ================================================================
   ★ 여기만 바꾸면 돼요 ★
   Firebase 콘솔에서 복사한 설정값을 아래 따옴표 안에 붙여넣으세요.
   비워 두면 '미리보기 모드'(예시 데이터, 저장 안 됨)로 열려요.
   ================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAp7lLIk6anQbM4mZHYxbFIKVTahusxt4k",
  authDomain: "moim-trip.firebaseapp.com",
  projectId: "moim-trip",
  storageBucket: "moim-trip.firebasestorage.app",

<script>
/* ---------- 기본 도구 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const WD=["일","월","화","수","목","금","토"];
const fmt=s=>{if(!s)return"";const d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"};
const daysLabel=n=>n<=1?"당일치기":(n-1)+"박 "+n+"일";
const HOL=new Set(["01-01","03-01","05-05","06-06","08-15","10-03","10-09","12-25"]); // 날짜가 고정된 공휴일만
const isHol=s=>HOL.has(s.slice(5));
const norm=s=>String(s||"").trim().replace(/\s+/g," ");
const safeUrl=u=>{u=norm(u);if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return""}};
function rangeDates(t){const out=[];let d=parse(t.start);const e=parse(t.end);let i=0;while(d<=e&&i<120){out.push(iso(d));d=addDays(d,1);i++}return out}
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

/* ---------- 카카오톡·인스타 안에서 열면 구글 로그인이 막혀요 → 바깥 브라우저로 ---------- */
const UA=navigator.userAgent||"";
const inKakao=/KAKAOTALK/i.test(UA);
const inApp=inKakao||/Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|DaumApps|everytimeApp/i.test(UA);
if(inKakao){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(location.href)}

/* ================================================================
   저장소 연결 부분 — Firebase(진짜) 또는 미리보기(가짜) 둘 중 하나
   ================================================================ */
const CONFIGURED=!!(firebaseConfig.apiKey&&firebaseConfig.projectId);
let api;

if(CONFIGURED){
  firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth(),fs=firebase.firestore();
  const FV=firebase.firestore.FieldValue;
  const tripRef=id=>fs.collection("trips").doc(id);
  const docs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  api={
    demo:false,
    onUser:cb=>auth.onAuthStateChanged(u=>cb(u?{uid:u.uid,name:u.displayName||"",photo:u.photoURL||"",email:u.email||""}:null)),
    login:()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{
      if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))return auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
      throw e}),
    logout:()=>auth.signOut(),
    onMyTrips:(uid,cb,err)=>fs.collection("trips").where("memberUids","array-contains",uid).onSnapshot(s=>cb(docs(s)),err),
    onTrip:(id,cb,err)=>tripRef(id).onSnapshot(s=>cb(s.exists?{id:s.id,...s.data()}:null),err),
    onMembers:(id,cb)=>tripRef(id).collection("members").onSnapshot(s=>cb(docs(s)),()=>{}),
    onRecs:(id,cb)=>tripRef(id).collection("recs").onSnapshot(s=>cb(docs(s)),()=>{}),
    createTrip:async data=>{const r=fs.collection("trips").doc();await r.set(data);return r.id},
    updateTrip:(id,patch)=>tripRef(id).update(patch),
    joinTrip:(id,uid)=>tripRef(id).update({memberUids:FV.arrayUnion(uid)}),
    setMember:(id,uid,data)=>tripRef(id).collection("members").doc(uid).set(data),
    addRec:(id,data)=>tripRef(id).collection("recs").add(data),
    toggleLike:(id,recId,uid,on)=>tripRef(id).collection("recs").doc(recId).update({likes:on?FV.arrayUnion(uid):FV.arrayRemove(uid)}),
    deleteRec:(id,recId)=>tripRef(id).collection("recs").doc(recId).delete(),
    deleteTrip:async(id,memberIds,recIds)=>{
      for(const m of memberIds)await tripRef(id).collection("members").doc(m).delete();
      for(const r of recIds)await tripRef(id).collection("recs").doc(r).delete();
      await tripRef(id).delete()}
  };
}else{
  /* 미리보기 모드: 이 브라우저 안에서만 돌아가는 가짜 저장소 + 예시 친구들 */
  const today=new Date();const ds=n=>iso(addDays(today,n));
  let startOff=14;while(addDays(today,startOff+5).getDay()!==5)startOff++;const S=ds(startOff); // 예시 날짜가 금·토·일에 오도록
  const pick=arr=>arr.map(n=>ds(startOff+n));
  const DB={trips:{},members:{},recs:{}};
  DB.trips.demo1={name:"(예시) 대학 동기 겨울 여행",start:S,end:ds(startOff+34),days:3,seeds:["강릉","여수","제주"],leader:"me",leaderNick:"나",status:"open",createdAt:Date.now(),memberUids:["me","a","b","c"]};
  DB.members.demo1={
    me:{nickname:"나",dates:pick([5,6,7,12,13,14,19,20,21]),places:["강릉"],note:"",updatedAt:1},
    a:{nickname:"민지(예시)",dates:pick([4,5,6,7,12,13,14,26,27,28]),places:["강릉","제주"],note:"바다 보고 싶어요",updatedAt:1},
    b:{nickname:"철수(예시)",dates:pick([5,6,7,8,19,20,21]),places:["여수","강릉"],note:"운전 가능해요",updatedAt:1},
    c:{nickname:"영희(예시)",dates:pick([5,6,7,12,13,14]),places:["제주"],note:"",updatedAt:1}};
  DB.recs.demo1={};
  const subs=new Set();const emit=()=>subs.forEach(f=>f());
  const sub=f=>{subs.add(f);setTimeout(f,0);return()=>subs.delete(f)};
  const clone=o=>JSON.parse(JSON.stringify(o));
  let me=null;
  api={
    demo:true,
    onUser:cb=>{setTimeout(()=>cb(me),0);api._userCb=cb;return()=>{}},
    login:async()=>{me={uid:"me",name:"나",photo:"",email:""};api._userCb(me)},
    logout:async()=>{me=null;api._userCb(null)},
    onMyTrips:(uid,cb)=>sub(()=>cb(Object.entries(DB.trips).filter(([k,t])=>(t.memberUids||[]).includes(uid)).map(([k,t])=>({id:k,...clone(t)})))),
    onTrip:(id,cb)=>sub(()=>cb(DB.trips[id]?{id,...clone(DB.trips[id])}:null)),
    onMembers:(id,cb)=>sub(()=>cb(Object.entries(DB.members[id]||{}).map(([k,v])=>({id:k,...clone(v)})))),
    onRecs:(id,cb)=>sub(()=>cb(Object.entries(DB.recs[id]||{}).map(([k,v])=>({id:k,...clone(v)})))),
    createTrip:async d=>{const id=rid();DB.trips[id]=clone(d);DB.members[id]={};DB.recs[id]={};emit();return id},
    updateTrip:async(id,p)=>{Object.assign(DB.trips[id],clone(p));emit()},
    joinTrip:async(id,uid)=>{const t=DB.trips[id];if(!t.memberUids.includes(uid))t.memberUids.push(uid);emit()},
    setMember:async(id,uid,d)=>{(DB.members[id]=DB.members[id]||{})[uid]=clone(d);emit()},
    addRec:async(id,d)=>{(DB.recs[id]=DB.recs[id]||{})[rid()]=clone(d);emit()},
    toggleLike:async(id,r,uid,on)=>{const x=DB.recs[id][r];x.likes=(x.likes||[]).filter(u=>u!==uid);if(on)x.likes.push(uid);emit()},
    deleteRec:async(id,r)=>{delete DB.recs[id][r];emit()},
    deleteTrip:async id=>{delete DB.trips[id];delete DB.members[id];delete DB.recs[id];emit()}
  };
}

function bindCreate(){
  $("#cCancel").onclick=()=>{showCreate=false;renderHome()};

    try{
      const id=await api.createTrip({name,start,end,days,seeds,leader:me.uid,leaderNick:nick,status:"open",createdAt:Date.now(),memberUids:[me.uid]});

function monthsOf(dates){const m=new Map();dates.forEach(s=>{const k=s.slice(0,7);if(!m.has(k))m.set(k,[]);m.get(k).push(s)});return m}
function calHTML(dates,cellFn,heat){
  let html="";
  for(const [k,list] of monthsOf(dates)){
    const [y,mo]=k.split("-").map(Number);const first=new Date(y,mo-1,1);const last=new Date(y,mo,0).getDate();
    const inRange=new Set(list);
    let cells=WD.map((w,i)=>`<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
    for(let i=0;i<first.getDay();i++)cells+=`<div class="d off" aria-hidden="true"></div>`;
    for(let d=1;d<=last;d++){const s=k+"-"+pad(d);const w=new Date(y,mo-1,d).getDay();
      const cls=(w===0?"sun":w===6?"sat":"")+(isHol(s)?" hol":"");
      cells+=inRange.has(s)?cellFn(s,d,cls):`<div class="d na ${cls}" aria-hidden="true">${d}</div>`}
    html+=`<div class="month"><h4 class="mono">${y}년 ${mo}월</h4><div class="cal ${heat?"heat":""}">${cells}</div></div>`;
  }
  return html;
}

function computeWindows(){
  const all=rangeDates(curTrip),n=Math.max(1,curTrip.days),resp=members.filter(m=>(m.dates||[]).length);
  const wins=[];
  for(let i=0;i+n<=all.length;i++){
    const win=all.slice(i,i+n);
    const can=resp.filter(m=>{const s=new Set(m.dates);return win.every(d=>s.has(d))});
    wins.push({start:win[0],end:win[win.length-1],can,cant:resp.filter(m=>!can.includes(m))});
  }
  wins.sort((a,b)=>b.can.length-a.can.length||a.start.localeCompare(b.start));
  return {wins:wins.filter(w=>w.can.length>0).slice(0,5),resp};
}

function renderGuide(){
  const p=$("#pane");if(!p)return;const t=curTrip;
  if(t.status!=="fixed"){p.innerHTML=`<section class="block empty">아직 여행지와 일정이 확정되지 않았어요.<br>여행장이 ‘결과’ 탭에서 확정하면 이곳에서 볼거리·숙소·맛집을 함께 정리할 수 있어요.</section>`;return}
  const d=t.finalDest;
  const quick=(label,q)=>`<a href="${L.naver(q)}" target="_blank" rel="noopener">${esc(label)} <b>네이버지도</b></a><a href="${L.kakao(q)}" target="_blank" rel="noopener"><b>카카오맵</b></a>`;
  p.innerHTML=`
  <section class="block">
    <div class="eyebrow">바로 찾아보기</div>
    <h3 class="h2">${esc(d)} · ${fmt(t.finalStart)} – ${fmt(t.finalEnd)}</h3>
    <div class="gcards">
      <div class="gcard"><div class="t">가볼 만한 곳</div><p class="small muted">지도에서 관광지·명소를 찾아봐요.</p><div class="quick">${quick("",d+" 가볼만한곳")}<a href="${L.blog(d+" 가볼만한곳 "+daysLabel(t.days))}" target="_blank" rel="noopener"><b>블로그 후기</b></a></div></div>
      <div class="gcard"><div class="t">숙소</div><p class="small muted">${members.length}명이 묵을 곳을 찾아봐요.</p><div class="quick">${quick("",d+" 숙소")}<a href="${L.yeogi(d)}" target="_blank" rel="noopener"><b>여기어때</b></a></div></div>
      <div class="gcard"><div class="t">맛집</div><p class="small muted">현지 맛집과 후기를 찾아봐요.</p><div class="quick">${quick("",d+" 맛집")}<a href="${L.blog(d+" 맛집 추천")}" target="_blank" rel="noopener"><b>블로그 후기</b></a></div></div>
    </div>
  </section>
  <section class="block">
    <div class="eyebrow">우리끼리 추천 목록</div>
    <h3 class="h2">찾은 곳을 올리고 ♥로 골라요</h3>
    <p class="lead">마음에 드는 곳을 찾으면 아래에 올려 주세요. 하트가 많은 곳이 위로 올라가요.</p>
    <form class="panel" id="recForm" style="margin-top:12px">
      <div class="grid2">
        <div class="field"><label for="rCat">종류</label><select id="rCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
        <div class="field"><label for="rName">이름</label><input type="text" id="rName" maxlength="40" placeholder="예) 안목해변 카페거리" required></div>
        <div class="field"><label for="rMemo">한줄 메모 (선택)</label><input type="text" id="rMemo" maxlength="100" placeholder="예) 바다 보이는 창가 자리 좋대요"></div>
        <div class="field"><label for="rLink">링크 (선택)</label><input type="text" id="rLink" maxlength="500" placeholder="네이버지도·블로그 주소 붙여넣기"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">추천 올리기</button><span class="small" id="recSt"></span></div>
    </form>
    <div id="recList" data-dest="${esc(d)}"></div>
  </section>`;
  renderRecList();
  $("#recForm").addEventListener("submit",async ev=>{ev.preventDefault();
    const name=norm($("#rName").value);if(!name)return;
    const nick=(members.find(m=>m.id===me.uid)||{}).nickname||me.name||"친구";
    const st=$("#recSt");
    try{await api.addRec(cur,{cat:$("#rCat").value,name,memo:norm($("#rMemo").value),link:safeUrl($("#rLink").value),by:me.uid,byNick:nick,likes:[me.uid],createdAt:Date.now()});
      st.textContent="올렸어요";st.style.color="var(--ok)";$("#rName").value="";$("#rMemo").value="";$("#rLink").value=""}
    catch(e){st.textContent="올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";st.style.color="var(--sun)"}
  });
}

function renderRecList(){
  const el=$("#recList");if(!el)return;const d=curTrip.finalDest;
  const list=recs.filter(r=>recCat==="all"||r.cat===recCat).sort((a,b)=>(b.likes||[]).length-(a.likes||[]).length||(b.createdAt||0)-(a.createdAt||0));
  const count=c=>recs.filter(r=>c==="all"||r.cat===c).length;
  el.innerHTML=`<div class="cat-tabs">${[["all","전체"],...Object.entries(CATS)].map(([k,v])=>`<button class="chip" aria-pressed="${recCat===k}" data-cat="${k}">${v}<span class="n">${count(k)}</span></button>`).join("")}</div>
    ${list.length?`<div class="gcards">${list.map(r=>{const liked=(r.likes||[]).includes(me.uid),link=safeUrl(r.link),q=d+" "+r.name;
      return `<div class="gcard">
        <div class="a">${esc(CATS[r.cat]||"")}</div>
        <div class="t">${esc(r.name)}</div>
        ${r.memo?`<p>${esc(r.memo)}</p>`:""}
        ${link?`<a class="ext" href="${esc(link)}" target="_blank" rel="noopener">링크 열기 ↗</a>`:""}
        <div class="maps"><a href="${L.naver(q)}" target="_blank" rel="noopener">네이버지도</a><a href="${L.kakao(q)}" target="_blank" rel="noopener">카카오맵</a></div>
        <div class="foot"><span class="by">${esc(r.byNick)}님 추천${(r.by===me.uid||isLeader())?` · <button class="xbtn" data-del="${esc(r.id)}">삭제</button>`:""}</span>
          <button class="like" aria-pressed="${liked}" data-like="${esc(r.id)}">♥ ${(r.likes||[]).length}</button></div>
      </div>`}).join("")}</div>`
    :`<div class="empty" style="margin-top:12px">${recs.length?"이 종류의 추천은 아직 없어요.":"아직 올라온 추천이 없어요. 위의 ‘바로 찾아보기’로 찾은 곳을 첫 번째로 올려 보세요."}</div>`}`;
  el.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{recCat=b.dataset.cat;renderRecList()});
  el.querySelectorAll("[data-like]").forEach(b=>b.onclick=async()=>{const r=recs.find(x=>x.id===b.dataset.like);if(!r)return;
    b.disabled=true;try{await api.toggleLike(cur,r.id,me.uid,!(r.likes||[]).includes(me.uid))}catch(e){b.disabled=false}});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api.deleteRec(cur,b.dataset.del)}catch(e){b.disabled=false}});
}
</script>

</body>
</html>
